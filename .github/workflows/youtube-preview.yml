
name: Gabu YouTube Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Preview latest YouTube video
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCRG7LdWB_-_fP7VF7nCPjcg"
          RSS_URL = (
              "https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={CHANNEL_ID}"
          )

          WEBHOOK = os.environ.get(
              "DISCORD_WEBHOOK_URL", ""
          ).strip()

          def request(url, data=None):
              headers = {
                  "User-Agent": "Mozilla/5.0",
              }

              if data is not None:
                  headers["Content-Type"] = (
                      "application/json"
                  )

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method="POST" if data else "GET",
              )

              try:
                  with urllib.request.urlopen(
                      req, timeout=30
                  ) as response:
                      return response.read()

              except urllib.error.HTTPError as exc:
                  # 不輸出 Webhook URL 或密鑰。
                  raise RuntimeError(
                      f"HTTP {exc.code} "
                      f"{exc.reason}"
                  ) from None

          print(
              "STEP 1: Reading YouTube RSS",
              flush=True
          )

          try:
              xml_data = request(RSS_URL)
              print(
                  "STEP 1 SUCCESS",
                  flush=True
              )
          except Exception as exc:
              print(
                  "STEP 1 FAILED:",
                  exc,
                  flush=True
              )
              sys.exit(1)

          print(
              "STEP 2: Finding latest video",
              flush=True
          )

          root = ET.fromstring(xml_data)

          ns = {
              "atom": (
                  "http://www.w3.org/2005/Atom"
              ),
              "yt": (
                  "http://www.youtube.com/xml/"
                  "schemas/2015"
              ),
          }

          entries = root.findall(
              "atom:entry", ns
          )

          if not entries:
              raise RuntimeError(
                  "YouTube RSS contains no videos"
              )

          # 以發布時間排序。
          latest = max(
              entries,
              key=lambda entry: entry.findtext(
                  "atom:published",
                  default="",
                  namespaces=ns,
              ),
          )

          title = latest.findtext(
              "atom:title",
              default="最新影片",
              namespaces=ns,
          )

          video_id = latest.findtext(
              "yt:videoId",
              default="",
              namespaces=ns,
          )

          published = latest.findtext(
              "atom:published",
              default="",
              namespaces=ns,
          )

          if not video_id:
              raise RuntimeError(
                  "Missing video ID"
              )

          video_url = (
              "https://www.youtube.com/watch?v="
              + video_id
          )

          print(
              "STEP 2 SUCCESS:",
              title,
              published,
              flush=True
          )

          if not WEBHOOK:
              raise RuntimeError(
                  "Missing DISCORD_WEBHOOK_URL"
              )

          payload = {
              "username": "加布",
              "content": (
                  "🧪 **YouTube 最新影片預覽**\n"
                  f"🎬 **{title}**\n"
                  f"📅 發布日期：{published[:10]}"
                  "\n\n"
                  + video_url
              ),
              "allowed_mentions": {
                  "parse": []
              },
          }

          data = json.dumps(
              payload,
              ensure_ascii=False,
          ).encode("utf-8")

          print(
              "STEP 3: Sending to Discord",
              flush=True
          )

          try:
              request(WEBHOOK, data=data)
              print(
                  "STEP 3 SUCCESS: "
                  "Discord preview sent",
                  flush=True
              )

          except Exception as exc:
              print(
                  "STEP 3 FAILED:",
                  exc,
                  flush=True
              )
              sys.exit(1)
          PY

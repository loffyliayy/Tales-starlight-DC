name: Gabu YouTube Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regression tests (no network)
        run: python -m unittest discover -s tests -v
      - name: Preview in logs only
        run: python scripts/youtube_feed.py

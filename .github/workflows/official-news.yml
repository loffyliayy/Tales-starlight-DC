
name: Gabu Official News

on:
  schedule:
    # 每 20 分鐘檢查一次（UTC）
    - cron: "7,27,47 * * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test message to Discord"
        type: boolean
        default: false

      dry_run:
        description: "Print previews without posting to Discord"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gabu-official-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free dependencies
        run: |
          python -m pip install \
            "requests>=2.31,<3" \
            "beautifulsoup4>=4.12,<5"

      - name: Check official announcements
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          python scripts/official_news.py

      - name: Save announcement state
        if: ${{ always() && (github.event_name == 'schedule' || (!inputs.dry_run && !inputs.test_notification)) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f official_news_state.json ]; then
            git add official_news_state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Gabu official news state"
              git pull --rebase
              git push
            else
              echo "No state changes"
            fi
          else
            echo "No state file to save"
          fi


name: HKfuntown YouTube Feed

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification to Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hkfuntown-youtube-feed
  cancel-in-progress: false

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check YouTube RSS and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}

        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCRG7LdWB_-_fP7VF7nCPjcg"

          RSS_URL = (
              "https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={CHANNEL_ID}"
          )

          STATE_FILE = "last_video.txt"

          webhook = os.environ.get(
              "DISCORD_WEBHOOK_URL", ""
          ).strip()

          if not webhook:
              raise RuntimeError(
                  "Missing DISCORD_WEBHOOK_URL secret"
              )

          # ====================================
          # Discord notification
          # ====================================

          def send_discord(title, video_url, test=False):

              if test:
                  description = (
                      "Webhook 測試成功！"
                  )
              else:
                  description = (
                      "HKfuntown 發布新影片！"
                  )

              payload = {
                  "username": "加布",

                  "embeds": [
                      {
                          "title": title,
                          "description": description,
                          "url": video_url,
                          "color": 3447003,
                          "footer": {
                              "text": "HKfuntown YouTube Feed"
                          }
                      }
                  ]
              }

              data = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": (
                          "HKfuntownFeed/1.0"
                      )
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      print(
                          "Discord HTTP status:",
                          response.status
                      )

                      print(
                          "Discord notification sent!"
                      )

              except urllib.error.HTTPError as e:

                  print(
                      "Discord HTTP status:",
                      e.code
                  )

                  # Do not expose the webhook URL.
                  # Display a limited response body.
                  error_body = e.read(
                      2000
                  ).decode(
                      "utf-8",
                      errors="replace"
                  )

                  error_body = error_body.replace(
                      webhook,
                      "[REDACTED WEBHOOK]"
                  )

                  print(
                      "Discord response:",
                      error_body
                  )

                  raise RuntimeError(
                      f"Discord request failed: HTTP {e.code}"
                  ) from None

          # ====================================
          # Fetch YouTube RSS
          # ====================================

          print("Checking HKfuntown RSS...")

          rss_request = urllib.request.Request(
              RSS_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              rss_request,
              timeout=30
          ) as response:

              rss_data = response.read()

          root = ET.fromstring(rss_data)

          namespaces = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": (
                  "http://www.youtube.com/xml/"
                  "schemas/2015"
              )
          }

          entries = root.findall(
              "atom:entry",
              namespaces
          )

          if not entries:
              raise RuntimeError(
                  "No videos found in YouTube RSS"
              )

          # Sort by publication date.
          entries.sort(
              key=lambda entry: entry.findtext(
                  "atom:published",
                  default="",
                  namespaces=namespaces
              ),
              reverse=True
          )

          latest = entries[0]

          video_id = latest.findtext(
              "yt:videoId",
              namespaces=namespaces
          )

          title = latest.findtext(
              "atom:title",
              namespaces=namespaces
          )

          if not video_id:
              raise RuntimeError(
                  "Video ID not found"
              )

          video_url = (
              "https://www.youtube.com/watch?v="
              + video_id
          )

          print("Latest video:", title)
          print("Video ID:", video_id)

          # ====================================
          # Manual Discord test
          # ====================================

          test_mode = os.environ.get(
              "TEST_NOTIFICATION",
              "false"
          ).lower() == "true"

          if test_mode:

              print(
                  "Sending Discord test notification..."
              )

              send_discord(
                  "Discord 通知測試成功",
                  video_url,
                  test=True
              )

          # ====================================
          # Check previous video
          # ====================================

          previous_id = ""

          if os.path.exists(STATE_FILE):

              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as file:

                  previous_id = file.read().strip()

          # First run:
          # Save current video without notification.

          if not previous_id:

              print(
                  "First run: initializing video state"
              )

          elif previous_id == video_id:

              print(
                  "No new video. Nothing to send."
              )

              raise SystemExit(0)

          else:

              print(
                  "New HKfuntown video detected!"
              )

              send_discord(
                  title,
                  video_url
              )

          # ====================================
          # Save state
          # ====================================

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  video_id + "\n"
              )

          print(
              "Video state updated successfully"
          )

          PY

      - name: Save latest video state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_video.txt

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update latest HKfuntown video"
            git push
          fi

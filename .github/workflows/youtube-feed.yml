
name: HKfuntown YouTube Feed

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification to Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youtube-feed
  cancel-in-progress: false

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check YouTube RSS and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: |
          python <<'PY'
          import os
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCRG7LdWB_-_fP7VF7nCPjcg"
          RSS_URL = (
              "https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={CHANNEL_ID}"
          )
          STATE_FILE = "last_video.txt"

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise RuntimeError(
                  "Missing DISCORD_WEBHOOK_URL secret"
              )

          def send_discord(title, url, test=False):
              description = (
                  "Webhook 測試成功！"
                  if test else
                  "HKfuntown 發布新影片！"
              )

              payload = {
                  "username": "HKfuntown Feed",
                  "embeds": [{
                      "title": title,
                      "description": description,
                      "url": url,
                      "color": 3447003,
                      "footer": {
                          "text": "HKfuntown YouTube Feed"
                      }
                  }]
              }

              request = urllib.request.Request(
                  webhook,
                  data=json.dumps(
                      payload,
                      ensure_ascii=False
                  ).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  print(
                      "Discord status:",
                      response.status
                  )

          print("Checking HKfuntown RSS...")

          request = urllib.request.Request(
              RSS_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              rss_data = response.read()

          root = ET.fromstring(rss_data)

          ns = {
              "atom": "http://www.w3.org/2005/Atom",
              "yt": "http://www.youtube.com/xml/schemas/2015"
          }

          entries = root.findall("atom:entry", ns)

          if not entries:
              raise RuntimeError(
                  "RSS returned no videos"
              )

          # Sort videos by publication date
          entries.sort(
              key=lambda e: e.findtext(
                  "atom:published",
                  default="",
                  namespaces=ns
              ),
              reverse=True
          )

          latest = entries[0]

          video_id = latest.findtext(
              "yt:videoId", namespaces=ns
          )

          title = latest.findtext(
              "atom:title", namespaces=ns
          )

          if not video_id:
              raise RuntimeError(
                  "RSS returned no video ID"
              )

          video_url = (
              "https://www.youtube.com/watch?v="
              + video_id
          )

          print("Latest video:", title)
          print("Video ID:", video_id)

          # Optional Discord test
          if os.environ.get(
              "TEST_NOTIFICATION", "false"
          ).lower() == "true":
              send_discord(
                  "Discord 通知測試成功",
                  video_url,
                  test=True
              )

          previous_id = ""

          if os.path.exists(STATE_FILE):
              with open(
                  STATE_FILE,
                  encoding="utf-8"
              ) as f:
                  previous_id = f.read().strip()

          # First run: save latest video
          # without sending an old notification
          if not previous_id:
              print("First run: initializing state")

          elif previous_id == video_id:
              print("No new video")
              raise SystemExit(0)

          else:
              print("New video detected!")

              send_discord(
                  "🎬 " + title,
                  video_url
              )

              print("Notification sent")

          # Save state only after successful delivery
          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(video_id + "\n")

          print("State updated")
          PY

      - name: Save latest video state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_video.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update latest HKfuntown video"
            git push
          else
            echo "No state changes"
          fi

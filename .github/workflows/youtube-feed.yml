name: HKfuntown YouTube Feed

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview in logs only (no Discord messages or state changes)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hkfuntown-youtube-feed
  cancel-in-progress: false

jobs:
  check-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regression tests (no network)
        run: python -m unittest discover -s tests -v
      - name: Configure state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Safe preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python scripts/youtube_feed.py
      - name: Check YouTube and notify Discord
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/youtube_feed.py --send

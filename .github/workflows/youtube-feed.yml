
name: HKfuntown YouTube Feed

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification to Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hkfuntown-youtube-feed
  cancel-in-progress: false

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install backup YouTube reader
        run: |
          python -m pip install --upgrade yt-dlp

      - name: Check YouTube and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}

        run: |
          python <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          CHANNEL_ID = "UCRG7LdWB_-_fP7VF7nCPjcg"
          CHANNEL_URL = "https://www.youtube.com/@HKfuntown/videos"
          RSS_URL = (
              "https://www.youtube.com/feeds/videos.xml"
              f"?channel_id={CHANNEL_ID}"
          )
          STATE_FILE = "last_video.txt"

          webhook = os.environ.get(
              "DISCORD_WEBHOOK_URL", ""
          ).strip()

          test_mode = (
              os.environ.get("TEST_NOTIFICATION", "false")
              .lower() == "true"
          )

          if not webhook:
              raise RuntimeError(
                  "Missing DISCORD_WEBHOOK_URL secret"
              )

          def send_discord(title, video_url, test=False):
              if test:
                  payload = {
                      "username": "加布",
                      "embeds": [{
                          "title": "Discord 通知測試成功",
                          "description": "Webhook 測試成功！",
                          "color": 3447003,
                          "footer": {
                              "text": "HKfuntown YouTube Feed"
                          }
                      }]
                  }
              else:
                  # Put the bare YouTube URL in content.
                  # Discord can generate its native player.
                  payload = {
                      "username": "加布",
                      "content": (
                          "🎬 **HKfuntown 發布新影片！**\n"
                          f"**{title}**\n\n"
                          f"{video_url}"
                      )
                  }

              data = json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8")

              request = urllib.request.Request(
                  webhook,
                  data=data,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "GabuYouTubeFeed/2.8"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      print(
                          "Discord HTTP status:",
                          response.status
                      )
              except urllib.error.HTTPError as error:
                  print(
                      "Discord HTTP status:",
                      error.code
                  )
                  raise RuntimeError(
                      "Discord notification failed"
                  ) from None

          def fetch_rss():
              namespaces = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "yt": (
                      "http://www.youtube.com/xml/"
                      "schemas/2015"
                  )
              }

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "Chrome/131.0 Safari/537.36"
                  ),
                  "Accept": (
                      "application/atom+xml,"
                      "application/xml,text/xml,*/*"
                  )
              }

              for attempt in range(1, 4):
                  print(f"RSS attempt {attempt}/3")

                  try:
                      request = urllib.request.Request(
                          RSS_URL,
                          headers=headers
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=25
                      ) as response:
                          rss_data = response.read()

                      root = ET.fromstring(rss_data)
                      entries = root.findall(
                          "atom:entry",
                          namespaces
                      )

                      if not entries:
                          raise ValueError(
                              "RSS contains no videos"
                          )

                      entries.sort(
                          key=lambda entry: entry.findtext(
                              "atom:published",
                              default="",
                              namespaces=namespaces
                          ),
                          reverse=True
                      )

                      latest = entries[0]

                      video_id = latest.findtext(
                          "yt:videoId",
                          namespaces=namespaces
                      )

                      title = latest.findtext(
                          "atom:title",
                          default="HKfuntown 新影片",
                          namespaces=namespaces
                      )

                      if not video_id:
                          raise ValueError(
                              "RSS video ID missing"
                          )

                      print("RSS successfully loaded")

                      return {
                          "id": video_id,
                          "title": title,
                          "url": (
                              "https://www.youtube.com/"
                              "watch?v=" + video_id
                          )
                      }

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                      ValueError,
                      ET.ParseError
                  ) as error:
                      print(
                          "RSS unavailable:",
                          type(error).__name__,
                          str(error)[:200]
                      )

                      if attempt < 3:
                          time.sleep(5)

              return None

          def fetch_backup():
              print(
                  "Trying backup YouTube reader..."
              )

              try:
                  import yt_dlp

                  options = {
                      "quiet": True,
                      "no_warnings": True,
                      "extract_flat": True,
                      "playlistend": 5,
                      "skip_download": True,
                      "socket_timeout": 25,
                      "retries": 2,
                      "ignoreerrors": True
                  }

                  with yt_dlp.YoutubeDL(
                      options
                  ) as youtube:
                      result = youtube.extract_info(
                          CHANNEL_URL,
                          download=False
                      )

                  if not result:
                      return None

                  entries = [
                      item
                      for item in result.get(
                          "entries", []
                      )
                      if item and item.get("id")
                  ]

                  if not entries:
                      print(
                          "Backup returned no videos"
                      )
                      return None

                  latest = entries[0]
                  video_id = latest["id"]

                  print(
                      "Backup reader succeeded"
                  )

                  return {
                      "id": video_id,
                      "title": latest.get(
                          "title",
                          "HKfuntown 新影片"
                      ),
                      "url": (
                          "https://www.youtube.com/"
                          "watch?v=" + video_id
                      )
                  }

              except Exception as error:
                  print(
                      "Backup reader unavailable:",
                      type(error).__name__,
                      str(error)[:200]
                  )
                  return None

          # Manual test: send the latest video
          # without changing last_video.txt.
          if test_mode:
              print("Running notification preview")

              video = fetch_rss()

              if video is None:
                  video = fetch_backup()

              if video is None:
                  print(
                      "YouTube unavailable. "
                      "Testing Discord webhook only."
                  )
                  send_discord(
                      "Discord 通知測試成功",
                      CHANNEL_URL,
                      test=True
                  )
              else:
                  send_discord(
                      video["title"],
                      video["url"]
                  )

              print(
                  "Preview complete. "
                  "Video state was not changed."
              )
              raise SystemExit(0)

          print("Checking HKfuntown YouTube...")

          video = fetch_rss()

          if video is None:
              video = fetch_backup()

          if video is None:
              print(
                  "WARNING: Both YouTube readers "
                  "are temporarily unavailable."
              )
              print(
                  "Keeping previous video state. "
                  "Next scheduled run will retry."
              )
              raise SystemExit(0)

          video_id = video["id"]
          title = video["title"]
          video_url = video["url"]

          print("Latest video:", title)
          print("Video ID:", video_id)

          previous_id = ""

          if os.path.exists(STATE_FILE):
              with open(
                  STATE_FILE,
                  "r",
                  encoding="utf-8"
              ) as file:
                  previous_id = file.read().strip()

          if not previous_id:
              print(
                  "First run: initializing state "
                  "without sending old video"
              )

          elif previous_id == video_id:
              print(
                  "No new video. Nothing to send."
              )
              raise SystemExit(0)

          else:
              print(
                  "New HKfuntown video detected!"
              )
              send_discord(
                  title,
                  video_url
              )

          with open(
              STATE_FILE,
              "w",
              encoding="utf-8"
          ) as file:
              file.write(video_id + "\n")

          print(
              "Video state updated successfully"
          )
          PY

      - name: Save latest video state
        if: ${{ !inputs.test_notification }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_video.txt

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update latest HKfuntown video"
            git pull --rebase
            git push
          fi
